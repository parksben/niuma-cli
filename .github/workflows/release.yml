name: Build & Release (Bun)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: niuma-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            artifact: niuma-linux-arm64
          - os: macos-latest
            target: bun-darwin-x64
            artifact: niuma-macos-x64
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: niuma-macos-arm64
          - os: windows-latest
            target: bun-windows-x64
            artifact: niuma-win-x64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: bun build ./src/index.js --compile --target=${{ matrix.target }} --outfile=${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Publish to niuma
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Publish to niuma release
        uses: softprops/action-gh-release@v2
        with:
          repository: parksben/niuma
          tag_name: ${{ steps.version.outputs.version }}
          name: "牛马 ${{ steps.version.outputs.version }}"
          files: dist/*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
